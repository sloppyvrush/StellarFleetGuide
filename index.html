<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erebus — полевое руководство экипажа</title>
<meta name="description" content="Интерактивный гайд по прохождению ролевого бота Erebus: подсказки без спойлеров, трекер улик, экипаж, корабль и станция.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ecee; --panel:#f5f7f8; --panel2:#dde3e6; --ink:#16232b; --muted:#566771; --line:#c2ccd2;
  --amber:#a8660c; --amber-soft:#f3e2c4; --teal:#1d7f76; --teal-soft:#d3ece8; --danger:#a3352b;
  --redact:#16232b; --focus:#1d7f76;
  --f-head:"Oswald","Arial Narrow",Arial,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121c22; --panel:#19262e; --panel2:#22323c; --ink:#d6e0e4; --muted:#8fa1ab; --line:#2d3e49;
    --amber:#e5a444; --amber-soft:#3a2e1a; --teal:#5fcfc1; --teal-soft:#193a38; --danger:#e0695c;
    --redact:#3b4d58; --focus:#5fcfc1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121c22; --panel:#19262e; --panel2:#22323c; --ink:#d6e0e4; --muted:#8fa1ab; --line:#2d3e49;
  --amber:#e5a444; --amber-soft:#3a2e1a; --teal:#5fcfc1; --teal-soft:#193a38; --danger:#e0695c;
  --redact:#3b4d58; --focus:#5fcfc1; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:5.5rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px;top:0}.skip:focus{left:1rem;top:1rem;z-index:99;background:var(--panel);padding:.5rem 1rem}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:.6rem 1.25rem;display:flex;gap:1rem;align-items:center}
.brand{font:600 1.15rem/1 var(--f-head);letter-spacing:.06em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand small{font:400 .8rem var(--f-body);letter-spacing:0;color:var(--muted);margin-left:.5rem}
.bar-tools{margin-left:auto;display:flex;gap:.4rem;align-items:center}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.3rem .6rem;font-size:.85rem}
.mini[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.stage-pill{font:500 .85rem var(--f-body);background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:.25rem .7rem;white-space:nowrap;text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 1.25rem;display:grid;grid-template-columns:210px minmax(0,1fr);gap:2.5rem}
nav.side{position:sticky;top:4.5rem;align-self:start;padding:1.5rem 0;max-height:calc(100vh - 5rem);overflow:auto}
nav.side h2{font:500 .8rem var(--f-body);color:var(--muted);margin:1.2rem 0 .4rem}
nav.side a{display:block;padding:.3rem .6rem;border-left:2px solid transparent;color:var(--ink);text-decoration:none;font-size:.95rem}
nav.side a:hover{border-left-color:var(--line)}
nav.side a.on{border-left-color:var(--amber);color:var(--amber)}
main{min-width:0;padding-bottom:5rem}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:0}nav.side{position:static;max-height:none;display:flex;gap:.3rem;overflow-x:auto;padding:.8rem 0 0;white-space:nowrap}nav.side h2{display:none}nav.side a{border:1px solid var(--line);border-radius:999px;padding:.25rem .75rem;font-size:.88rem}nav.side a.on{border-color:var(--amber)}.brand small{display:none}}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--f-head);font-weight:500;line-height:1.15;letter-spacing:.01em}
section{padding-top:3.5rem}
section>h2{font-size:2rem;margin:0 0 .4rem}
.lede{color:var(--muted);max-width:66ch;margin:0 0 1.5rem}
p{max-width:70ch}
.part{font:600 .95rem var(--f-head);letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--line);margin-top:4rem;padding-top:1rem}

/* ---------- hero: clearance rail ---------- */
.hero{padding:3rem 0 1rem}
.hero h1{font-size:clamp(2.6rem,6vw,4.4rem);margin:0;letter-spacing:.02em;line-height:1}
.hero .sub{font:400 1.15rem/1.5 var(--f-body);color:var(--muted);max-width:56ch;margin:.9rem 0 2rem}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.25rem}
.rail-q{font:500 1.35rem var(--f-head);margin:0 0 .25rem}
.rail-help{color:var(--muted);margin:0 0 1rem;font-size:.95rem}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.seg{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:.6rem .4rem;text-align:left;min-height:4.2rem;display:flex;flex-direction:column;gap:.15rem}
.seg b{font:600 1.3rem/1 var(--f-head)}
.seg span{font-size:.78rem;color:var(--muted);line-height:1.25}
.seg.done{background:var(--teal-soft);border-color:transparent}
.seg.cur{background:var(--amber-soft);border-color:var(--amber)}
.seg.cur b{color:var(--amber)}
.rail-foot{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:.5rem .9rem;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
@media (max-width:620px){.segs{grid-template-columns:repeat(3,1fr)}}

/* ---------- redaction ---------- */
.redact{display:inline-block;background:var(--redact);border-radius:2px;height:.95em;vertical-align:-.1em;margin-right:.3em}
.locked{border:1px dashed var(--line);border-radius:8px;padding:1rem;color:var(--muted)}
.locked p{margin:.3rem 0 0}
.unveil{animation:unveil .6s ease-out both}
@keyframes unveil{from{clip-path:inset(0 100% 0 0);background:var(--amber-soft)}to{clip-path:inset(0 0 0 0)}}

/* ---------- acts ---------- */
.acts{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
.act{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.act.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.act-h{display:grid;grid-template-columns:3.2rem 1fr auto;gap:1rem;align-items:center;padding:1rem 1.2rem;width:100%;background:none;border:0;text-align:left}
.act-n{font:600 2rem/1 var(--f-head);color:var(--muted)}
.act.cur .act-n{color:var(--amber)}
.act.done .act-n{color:var(--teal)}
.act-t{font:500 1.3rem/1.2 var(--f-head);margin:0}
.act-s{font-size:.85rem;color:var(--muted)}
.chev{transition:transform .2s}
.act[data-open="true"] .chev{transform:rotate(180deg)}
.act-b{padding:0 1.2rem 1.2rem 5.4rem}
@media (max-width:620px){.act-b{padding:0 1rem 1rem}}
.ladder{display:grid;gap:.6rem;margin:.6rem 0 1rem}
.rung{border-left:3px solid var(--line);padding:.4rem 0 .4rem .9rem}
.rung h4{margin:0;font:600 .8rem var(--f-body);color:var(--muted);letter-spacing:.02em}
.rung p{margin:.25rem 0 0}
.rung.t1{border-color:var(--teal)} .rung.t2{border-color:var(--amber)} .rung.t3{border-color:var(--danger)}
.done-when{background:var(--panel2);border-radius:6px;padding:.6rem .8rem;font-size:.95rem}
.done-when b{font-weight:600}
.act-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}

/* ---------- wizard / stuck ---------- */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:34rem;width:calc(100% - 2rem);padding:1.5rem}
dialog::backdrop{background:rgba(8,14,18,.6)}
dialog h3{margin:0 0 .6rem;font-size:1.5rem}
.q{font-size:1.1rem;margin:.4rem 0 1rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.4rem .85rem;font-size:.92rem;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.answer{margin-top:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem}
.answer h3{margin:0 0 .4rem;font-size:1.25rem}
.answer ol,.answer ul{margin:.4rem 0 0;padding-left:1.2rem}
.answer li{margin:.3rem 0;max-width:68ch}
code,.mono{font-family:var(--f-mono);font-size:.88em}
.ooc{display:flex;gap:.5rem;align-items:flex-start;background:var(--panel2);border-radius:6px;padding:.55rem .7rem;margin:.5rem 0}
.ooc code{flex:1;white-space:pre-wrap;word-break:break-word}

/* ---------- tracker ---------- */
.trk{display:grid;gap:1rem}
.trk fieldset{border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem 1rem;background:var(--panel)}
.trk legend{font:500 1.05rem var(--f-head);padding:0 .4rem}
.trk label{display:flex;gap:.6rem;align-items:flex-start;padding:.3rem 0;cursor:pointer}
.trk input{margin-top:.35rem;accent-color:var(--teal);width:1rem;height:1rem;flex:none}
.trk .where{color:var(--muted);font-size:.85rem}
.key-clue{color:var(--amber);font-size:.8rem;font-weight:600;margin-left:.3rem}
.note-out{font-family:var(--f-mono);font-size:.85rem;background:var(--panel2);border-radius:8px;padding:.8rem;white-space:pre-wrap;min-height:4rem;max-height:14rem;overflow:auto}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}

/* ---------- setup ---------- */
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:.8rem}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.2rem 1fr;gap:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem}
.steps li::before{content:counter(s);font:600 1.5rem/1 var(--f-head);color:var(--teal)}
.steps h3{margin:0 0 .2rem;font-size:1.15rem}
.steps p{margin:.2rem 0}
.tbl{overflow-x:auto;margin:.5rem 0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted)}

/* ---------- codex ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.person{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:var(--panel2);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .mono-fb{position:absolute;inset:0;display:grid;place-items:center;font:600 3.2rem var(--f-head);color:var(--muted);letter-spacing:.05em}
.person .pb{padding:.8rem 1rem 1rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.person h3{margin:0;font-size:1.3rem}
.role{color:var(--amber);font-size:.88rem;font-weight:500}
.person p{margin:0;font-size:.93rem}
.person details{margin-top:auto;padding-top:.4rem}
.person summary{cursor:pointer;color:var(--teal);font-size:.9rem}
.person dl{margin:.4rem 0 0;font-size:.9rem}
.person dt{font-weight:600;margin-top:.4rem}
.person dd{margin:0;color:var(--muted)}
.person.locked-card .ph{display:grid;place-items:center}
.sub-h{font:500 1.35rem var(--f-head);margin:2.2rem 0 .8rem}

.mapbox{display:grid;grid-template-columns:1fr;gap:1rem}
@media (min-width:980px){.mapbox.side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.mapbox.side .detail{grid-template-columns:1fr;position:sticky;top:5rem}}
.svgwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.8rem;overflow-x:auto}
.svgwrap svg{display:block;width:100%;height:auto;min-width:320px}
svg .hit{cursor:pointer}
svg .hit:focus{outline:none}
svg .hit:focus-visible .shape,svg .hit.sel .shape{stroke:var(--amber);stroke-width:2.5}
svg text{font-family:var(--f-body)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.detail.noimg{grid-template-columns:1fr}
@media (max-width:620px){.detail{grid-template-columns:1fr}}
.detail .img{aspect-ratio:16/10;background:var(--panel2);position:relative;min-height:100%}
.detail .img img{width:100%;height:100%;object-fit:cover}
.detail .img .mono-fb{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem;text-align:center;padding:1rem}
.detail .db{padding:1rem 1.2rem}
.detail h3{margin:0 0 .3rem;font-size:1.5rem}
.detail p{margin:.4rem 0}
.tag{display:inline-block;font-size:.8rem;border-radius:4px;padding:.1rem .45rem;margin-right:.3rem;background:var(--panel2);color:var(--muted)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.world-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:1rem}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem}
.wcard h3{margin:0 0 .3rem;font-size:1.2rem}
.wcard p{margin:.3rem 0;font-size:.95rem}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;padding:1.5rem 0 3rem;margin-top:4rem}
.warnbox{border-left:3px solid var(--amber);background:var(--amber-soft);padding:.7rem 1rem;border-radius:0 8px 8px 0;margin:1rem 0;color:var(--ink)}
</style>
</head>
<body>
<a class="skip" href="#guide">Перейти к гайду</a>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#top">EREBUS <small data-i="brandSub"></small></a>
  <div class="bar-tools">
    <a class="stage-pill" href="#top" id="pill"></a>
    <button class="mini" id="langBtn" aria-label="Language"></button>
    <button class="mini" id="themeBtn" aria-label="Theme">◐</button>
  </div>
</div></header>
<div class="wrap" id="top">
<nav class="side" aria-label="Sections" id="sidenav"></nav>
<main id="main"></main>
</div>
<dialog id="wiz" aria-labelledby="wizT"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   CONTENT — всё, что показывается на сайте, лежит здесь.
   Правьте тексты прямо в этом блоке. Каждая строка: { ru: "...", en: "..." }.
   stage: N — элемент скрыт, пока игрок не отметит, что дошёл до этапа N.
   Картинки: положите файлы в папки assets/... с указанными именами.
   ===================================================================== */
const L = (ru, en) => ({ ru, en });

const UI = {
  brandSub: L("полевое руководство экипажа", "crew field manual"),
  heroTitle: L("Потерялись на «Эребе»?", "Lost on Erebus?"),
  heroSub: L("Гайд по прохождению бота без лишних спойлеров. Отметьте, до какого этапа вы дошли, и сайт покажет только то, что вам уже можно знать.",
             "A walkthrough for the bot that won't spoil what you haven't reached. Mark how far you've got, and the site shows only what you're allowed to know."),
  railQ: L("Где вы сейчас?", "Where are you now?"),
  railHelp: L("Этап = главный вопрос, над которым бьётся экипаж. Всё, что дальше, остаётся засекреченным.",
              "A stage is the main question your crew is working on. Everything past it stays classified."),
  railUnsure: L("Не знаю — определить по вопросам", "Not sure — work it out"),
  railReset: L("Начать заново", "Start over"),
  stageShort: L("Этап", "Stage"),
  pill: L("Допуск: этап", "Clearance: stage"),
  navGuide: L("Прохождение", "Walkthrough"),
  navStuck: L("Застряли?", "Stuck?"),
  navTracker: L("Трекер улик", "Evidence tracker"),
  navSetup: L("Настройка SillyTavern", "SillyTavern setup"),
  navCodex: L("Кодекс", "Codex"),
  navCrew: L("Экипаж и люди", "Crew & people"),
  navShip: L("«Кассандра»", "The Cassandra"),
  navStation: L("Станция «Эреб»", "Erebus station"),
  navWorld: L("Мир", "The world"),
  guideLede: L("Шесть этапов тайны. Каждый отвечает на один вопрос и открывает следующий. Подсказки раскрываются по ступеням: сначала намёк, потом направление, и только в конце — прямой ответ.",
               "Six stages of the mystery. Each answers one question and raises the next. Hints open step by step: a nudge first, then a direction, and a straight answer only at the end."),
  t1: L("Намёк", "Nudge"), t2: L("Направление", "Direction"), t3: L("Прямо", "Straight answer"),
  showNext: L("Показать следующую подсказку", "Show next hint"),
  allShown: L("Все подсказки открыты", "All hints shown"),
  doneWhen: L("Этап пройден, когда:", "Stage is done when:"),
  markDone: L("Я прошёл этот этап", "I've finished this stage"),
  lockedAct: L("Засекречено. Откроется, когда вы дойдёте до этапа", "Classified. Opens when you reach stage"),
  lockedGeneric: L("Откроется на этапе", "Opens at stage"),
  peek: L("Всё равно показать", "Show anyway"),
  peekConfirm: L("Это спойлер для этапа {n}. Показать?", "This is a spoiler for stage {n}. Show it?"),
  statusDone: L("пройден", "done"), statusCur: L("вы здесь", "you are here"), statusLocked: L("засекречено", "classified"),
  stuckLede: L("Выберите, что пошло не так. Ни один ответ здесь не раскрывает сюжет.", "Pick what went wrong. None of these answers spoil the plot."),
  oocTitle: L("Можно вставить в сообщение:", "You can paste this into a message:"),
  copy: L("Копировать", "Copy"), copied: L("Скопировано", "Copied"),
  trackerLede: L("Отмечайте найденное. Внизу соберётся короткая сводка на английском — вставьте её в Author's Note чата, и бот не забудет, что экипаж уже знает. Отметки хранятся только в вашем браузере.",
                 "Tick what you've found. A short English summary builds below — paste it into the chat's Author's Note so the bot remembers what your crew already knows. Ticks are stored only in your browser."),
  keyClue: L("ключевая улика", "key clue"),
  noteTitle: L("Сводка для Author's Note", "Summary for Author's Note"),
  noteEmpty: L("Отметьте хотя бы одну находку.", "Tick at least one find."),
  copyNote: L("Скопировать сводку", "Copy summary"),
  clearTracker: L("Сбросить отметки", "Clear ticks"),
  resetConfirm: L("Сбросить этап, подсказки и все отметки?", "Reset your stage, hints and all ticks?"),
  clearConfirm: L("Сбросить все отметки трекера?", "Clear all tracker ticks?"),
  suggestStage: L("Вы отметили ключевую улику этапа {n}. Перейти на этап {m}?", "You ticked a key clue of stage {n}. Move to stage {m}?"),
  rescueTitle: L("Спасение выживших", "Rescuing the survivors"),
  rescueLede: L("Необязательная линия. У каждого выжившего своё условие — отмечайте, что уже сделано.", "Optional thread. Each survivor has their own condition — tick what's done."),
  setupLede: L("Один раз настроить — и можно играть.", "Set it up once, then play."),
  crewLede: L("Экипаж «Кассандры» и люди, которых вы встретите. Карточки показывают только то, что видно со стороны.", "The Cassandra's crew and the people you'll meet. Cards show only what anyone could see."),
  crewH: L("Экипаж", "Crew"), aboardH: L("На борту", "Aboard"), stationH: L("На станции", "On the station"),

  { h:L("Связь","Communication"), p:L("Сверхсветовая связь идёт через сеть ретрансляторов. Если ретранслятор сломан или сигнал глушат, удалённый объект оказывается отрезан, и спасательный корабль — единственная помощь.","FTL communication runs through a relay network. If a relay breaks or the signal is jammed, a remote site is cut off, and a rescue ship is the only help.") },

  { h:L("Не антиутопия","Not a dystopia"), p:L("Большинство законов работает, большинство учёных занимается настоящей наукой, большинство офицеров защищает людей. Именно поэтому «Эреб» так страшен — как исключение.","Most laws work, most scientists do real science, most officers protect people. That's exactly why Erebus is so frightening — as the exception.") },

/* x,y в viewBox 0 0 800 420 */
const STARS = [

  { id:"essa", x:520,y:160, r:5, stage:1, name:L("Эсса-4","Essa-4"), d:L("Родная планета Флика и других тали.","Home planet of Flick and the other Tali.") },
  { id:"heph", x:600,y:330, r:6, stage:4, name:L("«Гефест-12» / LV-938","Hephaestus-12 / LV-938"), d:L("Промышленная станция и астероид, связанные с происхождением организма.","An industrial station and asteroid tied to the organism's origin.") },
  { id:"erebus", x:690,y:200, r:10, stage:1, name:L("«Эреб»","Erebus"), d:L("Удалённая исследовательская станция на фронтире, бывший комплекс переработки астероидной руды. Связь потеряна.","A remote research station on the frontier, once an asteroid-ore processing complex. Contact lost.") },
];
const RELAYS = [["sol","inner"],["inner","aurora"],["inner","essa"],["sol","concordia"],["concordia","aster"],["essa","erebus"],["aster","heph"]];

/* ===================== APP ===================== */
(function(){
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("erebus."+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("erebus."+k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  lang: store.get("lang", (navigator.language||"").toLowerCase().startsWith("ru") ? "ru" : "en"),
  stage: Math.min(6, Math.max(1, store.get("stage", 1))),
  hints: store.get("hints", {}),
  ticks: new Set(store.get("ticks", [])),
  rescue: new Set(store.get("rescue", [])),
  peek: new Set(),
  stuck: null, ship: "bridge", station: "dock", star: "erebus",
};
let prevStage = S.stage;
const tr = o => o == null ? "" : (typeof o === "string" ? o : (o[S.lang] ?? o.ru));
const T = k => tr(UI[k]);
const fmt = (s, m) => s.replace(/\{(\w)\}/g, (_, k) => m[k]);
const roman = ["","I","II","III","IV","V","VI"];
const open = n => n <= S.stage || S.peek.has(n);
const bars = (n=3, seed=1) => { let o=""; for(let i=0;i<n;i++){ const w = 3 + ((seed*7 + i*13) % 6); o += `<span class="redact" style="width:${w}em"></span>`; } return o; };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),1600); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const a=document.createElement("textarea"); a.value=text; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch(_){} a.remove(); }
  toast(T("copied"));
}
function setStage(n){
  n = Math.min(6, Math.max(1, n));
  prevStage = S.stage; S.stage = n; store.set("stage", n); render();
}
function imgTag(src, alt, fbText){
  return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()"><div class="mono-fb" aria-hidden="true">${fbText}</div>`;
}
const initials = name => name.split(/[\s/]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("");

/* ---------- static bits ---------- */
function renderChrome(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i));
  $("#langBtn").textContent = S.lang === "ru" ? "EN" : "RU";
  $("#pill").textContent = `${T("pill")} ${S.stage}`;
  $("#sidenav").innerHTML = `
    <a href="#guide">${T("navGuide")}</a>
    <a href="#stuck">${T("navStuck")}</a>
    <a href="#tracker">${T("navTracker")}</a>
    <a href="#setup">${T("navSetup")}</a>
    <h2>${T("navCodex")}</h2>
    <a href="#crew">${T("navCrew")}</a>
    <a href="#ship">${T("navShip")}</a>
    <a href="#station">${T("navStation")}</a>
    <a href="#world">${T("navWorld")}</a>`;
}

/* ---------- hero / clearance rail ---------- */
function heroHTML(){
  const segs = ACTS.map(a => {
    const cls = a.n < S.stage ? "done" : a.n === S.stage ? "cur" : "";
    const label = a.n <= S.stage ? esc(tr(a.tag)) : bars(1, a.n);
    const status = a.n < S.stage ? T("statusDone") : a.n === S.stage ? T("statusCur") : T("statusLocked");
    return `<button class="seg ${cls}" data-seg="${a.n}" aria-pressed="${a.n===S.stage}" aria-label="${T("stageShort")} ${a.n}: ${status}">
      <b>${roman[a.n]}</b><span data-st="${a.n}">${label}</span></button>`;
  }).join("");
  return `<div class="hero">
    <h1>${T("heroTitle")}</h1>
    <p class="sub">${T("heroSub")}</p>
    <div class="rail">
      <p class="rail-q">${T("railQ")}</p>
      <p class="rail-help">${T("railHelp")}</p>
      <div class="segs" role="group" aria-label="${T("railQ")}">${segs}</div>
      <div class="rail-foot">
        <button class="btn" id="wizOpen">${T("railUnsure")}</button>
        <button class="btn ghost" id="resetAll">${T("railReset")}</button>
      </div>
    </div></div>`;
}

/* ---------- walkthrough ---------- */
function actHTML(a){
  const st = a.n < S.stage ? "done" : a.n === S.stage ? "cur" : "lock";
  if(!open(a.n)){
    return `<li class="act" data-act="${a.n}">
      <div class="act-h" style="cursor:default"><span class="act-n">${roman[a.n]}</span>
        <div><p class="act-t">${bars(3, a.n)}</p><span class="act-s">${T("statusLocked")}</span></div><span></span></div>
      <div class="act-b"><div class="locked">${T("lockedAct")} ${a.n}.
        <p><button class="btn ghost" data-peek="${a.n}">${T("peek")}</button></p></div></div></li>`;
  }
  const isOpen = S["open"+a.n] ?? (a.n === S.stage);
  const shown = Math.min(3, S.hints[a.n] || 1);
  const rung = (i) => `<div class="rung t${i+1}"><h4>${T("t"+(i+1))}</h4><p>${esc(tr(a.hints[i]))}</p></div>`;
  let body = `<div class="ladder">${[0,1,2].slice(0, shown).map(rung).join("")}</div>`;
  body += `<div class="act-actions">${shown < 3
      ? `<button class="btn ghost" data-more="${a.n}">${T("showNext")}: ${T("t"+(shown+1))}</button>`
      : `<span class="act-s">${T("allShown")}</span>`}</div>`;
  if(shown === 3 || a.n < S.stage) body += `<p class="done-when"><b>${T("doneWhen")}</b> ${esc(tr(a.done))}</p>`;
  if(a.n === S.stage && a.n < 6) body += `<div class="act-actions"><button class="btn" data-finish="${a.n}">${T("markDone")}</button></div>`;
  const status = st === "done" ? T("statusDone") : st === "cur" ? T("statusCur") : T("statusLocked");
  return `<li class="act ${st}" data-act="${a.n}" data-open="${isOpen}" data-st="${a.n}">
    <button class="act-h" data-toggle="${a.n}" aria-expanded="${isOpen}">
      <span class="act-n">${roman[a.n]}</span>
      <div><p class="act-t">${esc(tr(a.q))}</p><span class="act-s">${status}</span></div>
      <span class="chev" aria-hidden="true">▾</span></button>
    ${isOpen ? `<div class="act-b">${body}</div>` : ""}</li>`;
}
function guideHTML(){
  return `<section id="guide"><h2>${T("navGuide")}</h2><p class="lede">${T("guideLede")}</p>
    <ol class="acts">${ACTS.map(actHTML).join("")}</ol></section>`;
}

/* ---------- stuck ---------- */
function stuckHTML(){
  const chips = STUCK.map((s,i)=>`<button class="chip" data-stuck="${i}" aria-pressed="${S.stuck===i}">${esc(tr(s.q))}</button>`).join("");
  let ans = "";
  if(S.stuck !== null){
    const s = STUCK[S.stuck];
    ans = `<div class="answer" aria-live="polite"><h3>${esc(tr(s.a))}</h3>
      <ol>${s.steps.map(x=>`<li>${esc(tr(x))}</li>`).join("")}</ol>
      ${s.ooc ? `<p style="margin:.8rem 0 0">${T("oocTitle")}</p><div class="ooc"><code>${esc(tr(s.ooc))}</code>
        <button class="mini" data-copy="${esc(tr(s.ooc))}">${T("copy")}</button></div>` : ""}</div>`;
  }
  return `<section id="stuck"><h2>${T("navStuck")}</h2><p class="lede">${T("stuckLede")}</p>
    <div class="chips">${chips}</div>${ans}</section>`;
}

/* ---------- tracker ---------- */
function noteText(){
  const lines = [];
  EVIDENCE.forEach(g => g.items.forEach(it => { if(S.ticks.has(it.id) && open(g.stage)) lines.push("- " + it.note); }));
  if(!lines.length) return "";
  return `[EREBUS — WHAT THE CREW HAS FOUND SO FAR]\nCurrent mystery stage: ${S.stage}\n${lines.join("\n")}\nOnly characters who saw or were told about a find know it.`;
}
function trackerHTML(){
  let hidden = 0;
  const sets = EVIDENCE.map(g => {
    if(!open(g.stage)){ hidden++; return ""; }
    return `<fieldset data-st="${g.stage}"><legend>${T("stageShort")} ${roman[g.stage]} — ${esc(tr(ACTS[g.stage-1].tag))}</legend>
      ${g.items.map(it=>`<label><input type="checkbox" data-tick="${it.id}" data-stage="${g.stage}" data-key="${!!it.key}" ${S.ticks.has(it.id)?"checked":""}>
        <span>${esc(tr(it.t))}${it.key?`<span class="key-clue">${T("keyClue")}</span>`:""}<br><span class="where">${esc(tr(it.where))}</span></span></label>`).join("")}
    </fieldset>`;
  }).join("");
  const rescue = open(3)
    ? `<fieldset data-st="3"><legend>${T("rescueTitle")}</legend><p class="where" style="margin:.2rem 0 .5rem">${T("rescueLede")}</p>
        ${RESCUE.map(r=>`<p style="margin:.7rem 0 .1rem;font-weight:600">${esc(r.name)}</p>
          ${r.reqs.map((q,i)=>`<label><input type="checkbox" data-rescue="${r.id}_${i}" ${S.rescue.has(r.id+"_"+i)?"checked":""}><span>${esc(tr(q))}</span></label>`).join("")}
          ${r.note?`<p class="where" style="margin:.1rem 0 0 1.6rem">${esc(tr(r.note))}</p>`:""}`).join("")}
      </fieldset>`
    : `<div class="locked">${T("rescueTitle")}: ${T("lockedGeneric")} 3.</div>`;
  const note = noteText();
  return `<section id="tracker"><h2>${T("navTracker")}</h2><p class="lede">${T("trackerLede")}</p>
    <div id="suggest"></div>
    <div class="trk">${sets}
      ${hidden ? `<div class="locked">${bars(2,9)} ${T("lockedGeneric")} ${S.stage+1}+</div>` : ""}
      ${rescue}
      <div><h3 class="sub-h" style="margin-top:1rem">${T("noteTitle")}</h3>
        <div class="note-out" id="noteOut">${note ? esc(note) : `<span style="color:var(--muted)">${T("noteEmpty")}</span>`}</div>
        <div class="act-actions"><button class="btn" id="copyNote" ${note?"":"disabled"}>${T("copyNote")}</button>
        <button class="btn ghost" id="clearTicks">${T("clearTracker")}</button></div></div>
    </div></section>`;
}

/* ---------- setup ---------- */
function setupHTML(){
  return `<section id="setup"><h2>${T("navSetup")}</h2><p class="lede">${T("setupLede")}</p>
    <ol class="steps">${SETUP.map(s=>`<li><div><h3>${esc(tr(s.h))}</h3><p>${esc(tr(s.p))}</p>
      ${s.table ? `<div class="tbl"><table><tbody>${s.table.map(r=>`<tr><th scope="row">${esc(tr(r[0]))}</th><td>${esc(tr(r[1]))}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </div></li>`).join("")}</ol></section>`;
}

/* ---------- people ---------- */
function personHTML(p){
  const name = tr(p.name);
  if(p.stage && !open(p.stage)){
    return `<article class="person locked-card"><div class="ph"><div class="mono-fb">?</div></div>
      <div class="pb"><h3>${bars(2, p.stage+3)}</h3><p class="where">${T("lockedGeneric")} ${p.stage}</p></div></article>`;
  }
  const dl = [["voice",p.voice],["habits",p.habits],["withYou",p.you]].filter(x=>x[1]);
  return `<article class="person" data-st="${p.stage||1}"><div class="ph">${imgTag(p.photo, name, esc(initials(name)))}</div>
    <div class="pb"><h3>${esc(name)}</h3><span class="role">${esc(tr(p.role))}</span><p>${esc(tr(p.about))}</p>
    ${dl.length ? `<details><summary>${T("more")}</summary><dl>${dl.map(([k,v])=>`<dt>${T(k)}</dt><dd>${esc(tr(v))}</dd>`).join("")}</dl></details>` : ""}
    </div></article>`;
}
function crewHTML(){
  return `<p class="part">${T("navCodex")}</p>
  <section id="crew" style="padding-top:1.5rem"><h2>${T("navCrew")}</h2><p class="lede">${T("crewLede")}</p>
    <h3 class="sub-h">${T("crewH")}</h3><div class="people">${CREW.map(personHTML).join("")}</div>
    <h3 class="sub-h">${T("aboardH")}</h3><div class="people">${ABOARD.map(personHTML).join("")}</div>
    <h3 class="sub-h">${T("stationH")}</h3><div class="people">${STATION_PEOPLE.map(personHTML).join("")}</div>
  </section>`;
}

/* ---------- detail panel ---------- */
function detailHTML(item, extra=""){
  if(!item) return `<div class="detail"><div class="db"><p>${T("pickHint")}</p></div></div>`;
  const name = tr(item.name);
  const img = item.img ? `<div class="img">${imgTag(item.img, name, `${T("noImg")}<br><code>${esc(item.img)}</code>`)}</div>` : "";
  return `<div class="detail ${item.img?"":"noimg"}" aria-live="polite">${img}<div class="db"><h3>${esc(name)}</h3>${extra}<p>${esc(tr(item.d))}</p></div></div>`;
}

/* ---------- ship ---------- */
function shipHTML(){
  const rooms = SHIP.map(r=>`<g class="hit ${S.ship===r.id?"sel":""}" tabindex="0" role="button" data-ship="${r.id}" aria-label="${esc(tr(r.name))}">

/* ---------- station ---------- */
function stationHTML(){
  const vis = STATION.filter(l => open(l.stage));
  const lockedLeft = STATION.some(l => !open(l.stage));
  const rowH = 38, gap = 7, top = 20;
  let y = top, rows = "", dividerDone = false;
  vis.forEach((l, i) => {
    if(l.stage >= 2 && !dividerDone){
      rows += `<line x1="40" y1="${y+2}" x2="560" y2="${y+2}" stroke="var(--amber)" stroke-dasharray="6 5"/>`;
      y += 10; dividerDone = true;
    }
    const inset = Math.min(i, 8) * 6;
    rows += `<g class="hit ${S.station===l.id?"sel":""}" tabindex="0" role="button" data-station="${l.id}" aria-label="${esc(tr(l.name))}" data-st="${l.stage}">
      <rect class="shape" x="${60+inset}" y="${y}" width="${480-inset*2}" height="${rowH}" rx="3" fill="${l.stage>=2?"var(--amber-soft)":"var(--panel2)"}" stroke="var(--line)" stroke-width="1.5"/>
      <text x="300" y="${y+rowH/2+6}" text-anchor="middle" font-size="17" fill="var(--ink)">${esc(tr(l.name))}</text></g>`;
    y += rowH + gap;
  });
  if(lockedLeft){
    rows += `<rect x="120" y="${y}" width="360" height="${rowH}" rx="3" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
      <rect x="220" y="${y+14}" width="160" height="10" fill="var(--redact)"/>`;
    y += rowH + gap;
  }
  const svg = `<svg viewBox="0 0 600 ${y+14}" role="img" aria-label="${T("navStation")}">
    <line x1="300" y1="6" x2="300" y2="${y}" stroke="var(--line)" stroke-width="10" opacity=".45"/>${rows}</svg>`;
  const cur = vis.find(l=>l.id===S.station) || vis[0];
  const tag = cur ? `<span class="tag ${/выс|смерт|high|lethal/i.test(tr(cur.danger))?"warn":""}">${T("danger")}: ${esc(tr(cur.danger))}</span>` : "";
  return `<section id="station"><h2>${T("navStation")}</h2><p class="lede">${T("stationLede")}</p>
    <div class="mapbox side"><div class="svgwrap">${svg}</div>${detailHTML(cur, tag)}</div></section>`;
}

/* ---------- world ---------- */
function worldHTML(){
  const vis = STARS.filter(s => open(s.stage));
  const ids = new Set(vis.map(s=>s.id));
  const pos = Object.fromEntries(STARS.map(s=>[s.id,s]));
  const lines = RELAYS.filter(([a,b])=>ids.has(a)&&ids.has(b)).map(([a,b])=>
    `<line x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 5"/>`).join("");
  const nodes = vis.map(s=>`<g class="hit ${S.star===s.id?"sel":""}" tabindex="0" role="button" data-star="${s.id}" aria-label="${esc(tr(s.name))}" data-st="${s.stage}">
      <circle cx="${s.x}" cy="${s.y}" r="${s.r+12}" fill="transparent"/>
      <circle class="shape" cx="${s.x}" cy="${s.y}" r="${s.r}" fill="${s.id==="erebus"?"var(--amber)":s.id==="heph"?"var(--danger)":"var(--teal)"}" stroke="var(--panel)" stroke-width="2"/>
      <text x="${s.x}" y="${s.y - s.r - 8}" text-anchor="middle" font-size="13" fill="var(--ink)">${esc(tr(s.name))}</text></g>`).join("");
  const svg = `<svg viewBox="0 0 800 420" role="img" aria-label="${T("navWorld")}">
    <path d="M520 30 Q640 200 540 400" fill="none" stroke="var(--line)" stroke-width="1"/>
    <text x="700" y="400" font-size="12" fill="var(--muted)" text-anchor="middle">${S.lang==="ru"?"фронтир":"frontier"}</text>
    <path d="M${pos.essa.x} ${pos.essa.y} Q 610 150 ${pos.erebus.x-12} ${pos.erebus.y-4}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="7 5"/>
    ${lines}${nodes}</svg>`;
  const cur = vis.find(s=>s.id===S.star) || vis[vis.length-1];
  return `<section id="world"><h2>${T("navWorld")}</h2><p class="lede">${T("worldLede")}</p>
    <div class="mapbox"><div class="svgwrap">${svg}<p class="where" style="margin:.5rem 0 0">${T("mapNote")}</p></div>${detailHTML(cur)}</div>
    <div class="world-grid">${WORLD_CARDS.map(c=>`<div class="wcard"><h3>${esc(tr(c.h))}</h3><p>${esc(tr(c.p))}</p></div>`).join("")}</div>
  </section>`;
}

/* ---------- wizard ---------- */
function openWizard(){
  const d = $("#wiz"); let i = 0;
  const step = () => {
    d.innerHTML = `<h3 id="wizT">${T("wizTitle")}</h3><p class="q">${esc(tr(WIZ[i]))}</p>
      <div class="chips"><button class="btn" data-w="y">${T("yes")}</button><button class="btn ghost" data-w="n">${T("no")}</button>
      <button class="btn ghost" data-w="x" style="margin-left:auto">${T("close")}</button></div>`;
  };
  const result = n => {
    d.innerHTML = `<h3 id="wizT">${fmt(T("wizResult"),{n})}</h3>
      <div class="chips" style="margin-top:1rem"><button class="btn" data-w="set" data-n="${n}">${fmt(T("wizApply"),{n})}</button>
      <button class="btn ghost" data-w="x">${T("close")}</button></div>`;
  };
  d.onclick = e => {
    const b = e.target.closest("[data-w]"); if(!b) return;
    const w = b.dataset.w;
    if(w === "x") return d.close();
    if(w === "set"){ d.close(); setStage(+b.dataset.n); location.hash = "#guide"; return; }
    if(w === "n") return result(i + 1);
    i++; if(i >= WIZ.length) return result(6); step();
  };
  step(); d.showModal();
}

/* ---------- render ---------- */
function render(){
  renderChrome();
  $("#main").innerHTML = heroHTML() + guideHTML() + stuckHTML() + trackerHTML() + setupHTML()
    + crewHTML() + shipHTML() + stationHTML() + worldHTML()
    + `<footer>${T("footer")}</footer>`;
  if(S.stage > prevStage){
    document.querySelectorAll("[data-st]").forEach(el => { const s=+el.dataset.st; if(s>prevStage && s<=S.stage) el.classList.add("unveil"); });
  }
  prevStage = S.stage;
  spy();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-ship],[data-station],[data-star]"); if(!t) return;
  const d = t.dataset;
  if(d.seg){ const n=+d.seg; if(n > S.stage+1 && !confirm(fmt(T("peekConfirm"),{n}))) return; setStage(n); }
  else if(d.toggle){ const n=+d.toggle; S["open"+n] = !(S["open"+n] ?? (n===S.stage)); render(); $(`[data-toggle="${n}"]`)?.focus(); }
  else if(d.more){ const n=+d.more; S.hints[n]=Math.min(3,(S.hints[n]||1)+1); store.set("hints",S.hints); render(); $(`[data-act="${n}"] .rung:last-child`)?.scrollIntoView({block:"nearest"}); }
  else if(d.finish){ const n=+d.finish; S["open"+(n+1)] = true; S["open"+n] = false; setStage(n+1); $(`[data-act="${n+1}"]`)?.scrollIntoView({block:"start"}); }
  else if(d.peek){ const n=+d.peek; if(confirm(fmt(T("peekConfirm"),{n}))){ S.peek.add(n); S["open"+n]=true; render(); } }
  else if(d.stuck!==undefined){ const i=+d.stuck; S.stuck = S.stuck===i?null:i; render(); $(`[data-stuck="${i}"]`)?.focus(); }
  else if(d.copy){ copy(d.copy); }
  else if(d.ship){ S.ship=d.ship; render(); $(`[data-ship="${d.ship}"]`)?.focus(); }
  else if(d.station){ S.station=d.station; render(); $(`[data-station="${d.station}"]`)?.focus(); }
  else if(d.star){ S.star=d.star; render(); $(`[data-star="${d.star}"]`)?.focus(); }
  else if(t.id==="copyNote"){ const n=noteText(); if(n) copy(n); }
  else if(t.id==="clearTicks"){ if(confirm(T("clearConfirm"))){ S.ticks.clear(); S.rescue.clear(); store.set("ticks",[]); store.set("rescue",[]); render(); } }
  else if(t.id==="wizOpen"){ openWizard(); }
  else if(t.id==="resetAll"){ if(confirm(T("resetConfirm"))){ S.ticks.clear(); S.rescue.clear(); S.hints={}; store.set("ticks",[]); store.set("rescue",[]); store.set("hints",{}); prevStage=1; S.stage=1; store.set("stage",1); render(); } }
  else if(t.id==="langBtn"){ S.lang = S.lang==="ru"?"en":"ru"; store.set("lang",S.lang); render(); }
  else if(t.id==="themeBtn"){
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("theme", next);
  }
});
document.addEventListener("keydown", e => {
  if((e.key==="Enter"||e.key===" ") && e.target.matches("svg .hit")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.tick){
    t.checked ? S.ticks.add(t.dataset.tick) : S.ticks.delete(t.dataset.tick); store.set("ticks",[...S.ticks]);
    $("#noteOut").textContent = noteText() || T("noteEmpty"); $("#copyNote").disabled = !noteText();
    const st = +t.dataset.stage;
    if(t.checked && t.dataset.key==="true" && st===S.stage && st<6){
      $("#suggest").innerHTML = `<div class="warnbox">${fmt(T("suggestStage"),{n:st,m:st+1})} <button class="btn" data-seg="${st+1}" style="margin-left:.5rem">${fmt(T("wizApply"),{n:st+1})}</button></div>`;
    }
  }
  if(t.dataset.rescue){ t.checked ? S.rescue.add(t.dataset.rescue) : S.rescue.delete(t.dataset.rescue); store.set("rescue",[...S.rescue]); }
});

/* ---------- scroll spy ---------- */
let io;
function spy(){
  if(!("IntersectionObserver" in window)) return;
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(en => {
    if(en.isIntersecting){ document.querySelectorAll("nav.side a").forEach(a => a.classList.toggle("on", a.getAttribute("href")==="#"+en.target.id)); }
  }), {rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll("main section[id]").forEach(s => io.observe(s));
}

const th = store.get("theme", null); if(th) document.documentElement.dataset.theme = th;
render();
})();
</script>
</body></html>
